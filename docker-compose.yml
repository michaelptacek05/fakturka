# Produkční stack pro Portainer za nginx proxy managerem.
# Pro lokální vývoj použijte docker-compose.dev.yml.
#
# Vyžaduje existující externí síť nginx-proxy-manager_default.
# Pokud ji nemáte, vytvořte ji: docker network create nginx-proxy-manager_default

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fakturka}
      POSTGRES_USER: ${POSTGRES_USER:-fakturka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD musi byt nastaveno}
    healthcheck:
      # -h vynutí kontrolu přes TCP. Bez něj pg_isready uspěje už během
      # initdb, kdy server poslouchá jen na unixovém socketu — databáze se
      # označí jako healthy, migrate se rozjede a narazí na restartující
      # se server, případně na ještě nenastavené heslo.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-fakturka} -d $${POSTGRES_DB:-fakturka}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  migrate:
    image: ghcr.io/michaelptacek05/fakturka:migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fakturka}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fakturka}?schema=public
    restart: "no"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - internal

  app:
    image: ghcr.io/michaelptacek05/fakturka:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fakturka}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fakturka}?schema=public
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?AUTH_PASSWORD musi byt nastaveno}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET musi byt nastaveno}
    # Publikovaný port slouží k ladění z hostitele. Nginx proxy manager
    # se k aplikaci připojuje po síti nginx-proxy-manager_default na host "app", port 3000.
    # Pro přímé vystavení na veřejné rozhraní nastavte APP_BIND=0.0.0.0.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - invoice_storage:/app/storage
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - internal
      - nginx-proxy-manager_default

volumes:
  invoice_storage:
  postgres_data:

networks:
  internal:
  nginx-proxy-manager_default:
    external: true
