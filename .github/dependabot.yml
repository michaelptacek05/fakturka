version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 zatím nepodporuje typescript-eslint z eslint-config-next.
      # Odebrat po ověření kompatibility; starší podporované řady se aktualizují dál.
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      next-react:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
