name: CI a publikace Docker image

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Lint a typová kontrola
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Generovat Prisma klienta
        run: npm run prisma:generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Testy
        run: npm test

  build-and-push:
    name: Build a push image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Přihlášení do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build a push aplikace
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/michaelptacek05/fakturka:latest
            ghcr.io/michaelptacek05/fakturka:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build a push migrátoru
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/michaelptacek05/fakturka:migrate
            ghcr.io/michaelptacek05/fakturka:migrate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
