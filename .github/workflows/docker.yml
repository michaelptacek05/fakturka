name: CI a publikace Docker image

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint a typová kontrola
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://fakturka:ci-only@localhost:5432/fakturka
      NEXT_TELEMETRY_DISABLED: 1
      TZ: UTC
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Generovat Prisma klienta
        run: npm run prisma:generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Testy
        run: npm test

      - name: Testy agentů a notifikací
        run: npm run test:agents

      - name: Produkční build
        run: npm run build

  integration:
    name: Integrační testy PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://fakturka:ci-only@localhost:5432/fakturka
      TZ: UTC
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fakturka
          POSTGRES_USER: fakturka
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fakturka -d fakturka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Generovat Prisma klienta
        run: npm run prisma:generate

      - name: Integrační testy
        run: npm run test:integration

  build-and-push:
    name: Build a push image
    needs: [verify, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Přihlášení do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build a push aplikace
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/michaelptacek05/fakturka:latest
            ghcr.io/michaelptacek05/fakturka:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build a push migrátoru
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/michaelptacek05/fakturka:migrate
            ghcr.io/michaelptacek05/fakturka:migrate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
