name: Agenti — událost Codex review

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  signal:
    name: Předat událost review
    if: github.actor == (vars.CODEX_REVIEW_BOT || 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # Tento workflow pouze předá událost. Nemá token pro zápis ani
      # nespouští kód PR. Zápis provede workflow_run z výchozí větve,
      # takže upozornění funguje i pro PR z forků.
      - name: Událost přijata
        run: echo 'Codex review bude vyhodnoceno notifikačním workflow.'
